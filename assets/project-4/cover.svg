<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="'Inter','Noto Sans SC',-apple-system,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0f"/>
      <stop offset="1" stop-color="#12121f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1e30"/>
      <stop offset="1" stop-color="#15151f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#glow)"/>

  <!-- grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="500"/>
    <line x1="320" y1="0" x2="320" y2="500"/>
    <line x1="480" y1="0" x2="480" y2="500"/>
    <line x1="640" y1="0" x2="640" y2="500"/>
  </g>

  <!-- central chip -->
  <g transform="translate(360,190)">
    <rect x="0" y="0" width="80" height="80" rx="8" fill="url(#chip)" stroke="url(#accent)" stroke-width="1.5"/>
    <rect x="20" y="20" width="40" height="40" rx="4" fill="none" stroke="#6366f1" stroke-opacity="0.5"/>
    <!-- pins -->
    <g fill="#818cf8">
      <rect x="-14" y="10" width="14" height="3"/>
      <rect x="-14" y="24" width="14" height="3"/>
      <rect x="-14" y="38" width="14" height="3"/>
      <rect x="-14" y="52" width="14" height="3"/>
      <rect x="80" y="10" width="14" height="3"/>
      <rect x="80" y="24" width="14" height="3"/>
      <rect x="80" y="38" width="14" height="3"/>
      <rect x="80" y="52" width="14" height="3"/>
      <rect x="12" y="-14" width="3" height="14"/>
      <rect x="30" y="-14" width="3" height="14"/>
      <rect x="48" y="-14" width="3" height="14"/>
      <rect x="12" y="80" width="3" height="14"/>
      <rect x="30" y="80" width="3" height="14"/>
      <rect x="48" y="80" width="3" height="14"/>
    </g>
  </g>

  <!-- traces -->
  <g fill="none" stroke-linecap="round">
    <path d="M346 210 H260 V140 H210" stroke="#6366f1" stroke-width="2" stroke-opacity="0.7"/>
    <path d="M346 250 H240 V360 H210" stroke="#8b5cf6" stroke-width="2" stroke-opacity="0.7"/>
    <path d="M454 210 H560 V140 H600" stroke="#06b6d4" stroke-width="2" stroke-opacity="0.7"/>
    <path d="M454 250 H580 V360 H600" stroke="#6366f1" stroke-width="2" stroke-opacity="0.7"/>
    <path d="M400 176 V120 H300" stroke="#8b5cf6" stroke-width="2" stroke-opacity="0.7"/>
    <path d="M400 284 V380 H320" stroke="#06b6d4" stroke-width="2" stroke-opacity="0.7"/>
  </g>

  <!-- nodes -->
  <g>
    <circle cx="210" cy="140" r="6" fill="#6366f1"/>
    <circle cx="210" cy="360" r="6" fill="#8b5cf6"/>
    <circle cx="600" cy="140" r="6" fill="#06b6d4"/>
    <circle cx="600" cy="360" r="6" fill="#6366f1"/>
    <circle cx="300" cy="120" r="6" fill="#8b5cf6"/>
    <circle cx="320" cy="380" r="6" fill="#06b6d4"/>
  </g>

  <!-- title -->
  <text x="400" y="90" text-anchor="middle" font-size="34" font-weight="700" fill="#e8e8ed" letter-spacing="2">硬件 AI 工作流</text>
  <text x="400" y="120" text-anchor="middle" font-size="15" fill="#818cf8" letter-spacing="6">AI HARDWARE WORKFLOW</text>
</svg>
