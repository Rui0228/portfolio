<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="'Inter','Noto Sans SC',-apple-system,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0f"/>
      <stop offset="1" stop-color="#12121f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#glow)"/>

  <!-- canvas frame -->
  <g transform="translate(300,130)">
    <rect x="0" y="0" width="240" height="260" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <!-- draggable elements inside canvas -->
    <rect x="24" y="28" width="120" height="30" rx="4" fill="url(#accent)" opacity="0.9"/>
    <rect x="24" y="72" width="160" height="12" rx="3" fill="#a0a0b0" opacity="0.5"/>
    <rect x="24" y="96" width="80" height="10" rx="3" fill="#a0a0b0" opacity="0.4"/>
    <rect x="24" y="140" width="190" height="90" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
    <!-- drag handle -->
    <rect x="180" y="128" width="22" height="22" rx="5" fill="#6366f1"/>
    <circle cx="191" cy="139" r="3" fill="#fff"/>
  </g>

  <!-- editor panel -->
  <g transform="translate(570,130)">
    <rect x="0" y="0" width="150" height="260" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)"/>
    <rect x="12" y="16" width="126" height="10" rx="3" fill="#8b5cf6" opacity="0.6"/>
    <rect x="12" y="44" width="90" height="8" rx="3" fill="#a0a0b0" opacity="0.4"/>
    <rect x="12" y="64" width="126" height="24" rx="6" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
    <rect x="12" y="100" width="90" height="8" rx="3" fill="#a0a0b0" opacity="0.4"/>
    <rect x="12" y="120" width="126" height="6" rx="3" fill="rgba(255,255,255,0.08)"/>
    <circle cx="20" cy="123" r="5" fill="url(#accent)"/>
    <rect x="12" y="146" width="90" height="8" rx="3" fill="#a0a0b0" opacity="0.4"/>
    <!-- color swatches -->
    <rect x="12" y="166" width="22" height="22" rx="5" fill="#6366f1"/>
    <rect x="40" y="166" width="22" height="22" rx="5" fill="#8b5cf6"/>
    <rect x="68" y="166" width="22" height="22" rx="5" fill="#06b6d4"/>
    <rect x="96" y="166" width="22" height="22" rx="5" fill="#e8551a"/>
  </g>

  <!-- connecting cursor -->
  <g transform="translate(555,180)">
    <path d="M0 0 L8 -8 L4 -8 L8 -20" fill="none" stroke="#e8e8ed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- title -->
  <text x="400" y="90" text-anchor="middle" font-size="34" font-weight="700" fill="#e8e8ed" letter-spacing="2">设计 AI 工具</text>
  <text x="400" y="120" text-anchor="middle" font-size="15" fill="#a78bfa" letter-spacing="6">AI DESIGN TOOLKIT</text>
</svg>
