<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="'SF Mono','Cascadia Code','Fira Code','Consolas',monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0f"/>
      <stop offset="1" stop-color="#12121f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- window frame -->
  <rect x="30" y="55" width="740" height="400" rx="12" fill="#111118" stroke="#2a2a3a" stroke-width="1.5"/>

  <!-- title bar -->
  <rect x="30" y="55" width="740" height="44" rx="12" fill="#16161f"/>
  <rect x="30" y="77" width="740" height="22" fill="#16161f"/>
  <circle cx="52" cy="77" r="6" fill="#ff5f57"/>
  <circle cx="72" cy="77" r="6" fill="#febc2e"/>
  <circle cx="92" cy="77" r="6" fill="#28c840"/>
  <text x="400" y="82" text-anchor="middle" font-size="13" fill="#6b6b80" font-family="'Inter','Noto Sans SC',sans-serif">图片编辑器框架.md</text>

  <!-- line numbers -->
  <g font-size="13" fill="#3a3a4a" text-anchor="end">
    <text x="56" y="132">1</text>
    <text x="56" y="158">2</text>
    <text x="56" y="184">3</text>
    <text x="56" y="210">4</text>
    <text x="56" y="236">5</text>
    <text x="56" y="262">6</text>
    <text x="56" y="288">7</text>
    <text x="56" y="314">8</text>
    <text x="56" y="340">9</text>
    <text x="56" y="366">10</text>
    <text x="56" y="392">11</text>
    <text x="56" y="418">12</text>
  </g>

  <!-- content -->
  <g font-size="15">
    <text x="76" y="132" fill="#a78bfa" font-weight="700"># 图片编辑器框架</text>
    <text x="76" y="158" fill="#818cf8">## 编辑器功能清单</text>
    <text x="76" y="184" fill="#a0a0b0"><tspan fill="#e8e8ed">Ctrl+E</tspan> — 打开 / 关闭控制面板</text>
    <text x="76" y="210" fill="#a0a0b0"><tspan fill="#e8e8ed">拖拽移动</tspan> — 自动吸附对齐（阈值 5px）</text>
    <text x="76" y="236" fill="#a0a0b0"><tspan fill="#e8e8ed">Ctrl+Z</tspan> — 撤销，最多记忆 80 步</text>
    <text x="76" y="262" fill="#a0a0b0"><tspan fill="#e8e8ed">导出 PNG</tspan> — 2x Retina 画质</text>
    <text x="76" y="288" fill="#a0a0b0"><tspan fill="#e8e8ed">复制 CSS</tspan> — 变量一键复制</text>
    <text x="76" y="314" fill="#818cf8">## 技术架构</text>
    <text x="76" y="340" fill="#a0a0b0"><tspan fill="#06b6d4">editor.css</tspan> — 编辑器 UI 样式</text>
    <text x="76" y="366" fill="#a0a0b0"><tspan fill="#06b6d4">editor.js</tspan> — 编辑器全部逻辑</text>
    <text x="76" y="392" fill="#a0a0b0"><tspan fill="#06b6d4">outputs/*.html</tspan> — 每个设计一个文件</text>
    <text x="76" y="418" fill="#4a4a5a">···</text>
  </g>

  <!-- bottom accent bar -->
  <rect x="30" y="455" width="740" height="3" rx="1.5" fill="url(#accent)"/>
</svg>
